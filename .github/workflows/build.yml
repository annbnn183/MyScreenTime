name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Required to create a Release. Without this, action-gh-release fails with HTTP 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The app's versionName is the ONE source of truth. Reading it here (instead of hardcoding
    # v1.0.<run_number>) guarantees the in-app version, APK filename, release tag and release
    # name always match. Bump versionName + versionCode in app/build.gradle.kts to cut a release.
    - name: Read app version from Gradle
      id: version
      run: |
        V=$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts \
             | sed -E 's/.*"([^"]*)".*/\1/')
        if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Invalid or missing versionName in app/build.gradle.kts: '$V'" >&2
          exit 1
        fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Release version: v$V (from app/build.gradle.kts)"

    # A fixed keystore keeps the signing certificate identical across every CI run, so users can
    # install newer builds directly over older ones instead of being forced to uninstall first.
    - name: Decode the fixed signing keystore
      id: keystore
      run: |
        if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/myscreentime.jks"
          echo "path=$RUNNER_TEMP/myscreentime.jks" >> "$GITHUB_OUTPUT"
          echo "Fixed signing keystore decoded."
        else
          echo "No keystore secret configured; falling back to the default debug certificate."
        fi

    # The project has "default" and "gplay" product flavors, so a plain `assembleDebug` puts the
    # APK under apk/<flavor>/debug/ instead of apk/debug/. Build one flavor explicitly.
    - name: Build debug APK with Gradle
      env:
        ANDROID_KEY_STORE_FILE: ${{ steps.keystore.outputs.path }}
        ANDROID_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleDefaultDebug

    - name: Locate and rename APK
      run: |
        APK=$(find app/build/outputs/apk/default/debug -name "*.apk" -type f | head -n 1)
        if [ -z "$APK" ]; then
          echo "No APK was produced. Contents of app/build/outputs/apk:"
          find app/build/outputs/apk -type f || true
          exit 1
        fi
        echo "Found APK: $APK"
        mkdir -p artifacts
        cp "$APK" "artifacts/MyScreenTime-v${{ steps.version.outputs.version }}.apk"
        ls -lh artifacts

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: MyScreenTime v${{ steps.version.outputs.version }}
        body: |
          MyScreenTime **v${{ steps.version.outputs.version }}** - automated build from commit ${{ github.sha }} (run #${{ github.run_number }}).

          > The version shown inside the app, the APK filename and this release tag are ALL read
          > from `versionName` in `app/build.gradle.kts`, so they can never drift apart again.

          What's new in v1.0.15 (bugfix + UX, from exported-log evidence):
          - FIXED "sorting does not update icons": after re-sorting the ranking, a cell kept showing
            the PREVIOUS app's icon while its name/data changed. Root cause: the icon was loaded via
            produceState, whose result State lives in a plain remember {} (no keys) and whose producer
            had an "if (value == null)" guard; when a different package moved into that slot the old
            bitmap was still non-null, so the new icon was NEVER loaded. The icon state is now keyed
            by (packageName, sizePx) so it is rebuilt for the correct app, and every grid cell is
            wrapped in key(packageName) so its identity follows the app instead of the row position.
          - Sort control is now a direct drop-down picker with a check on the active mode, instead
            of a button that silently cycled through modes one tap at a time.
          - LogsScreen no longer enumerates log files on the main thread (StrictMode DiskReadViolation
            seen in every exported log when the log screen opened); the directory walk now runs on IO.
          - LOGGING POLICY UNCHANGED: every event is still captured, saved forever, never deleted;
            the full-history TXT export keeps exactly the same content.

          Earlier releases:
          - v1.0.14: statistical accuracy - removed INTERVAL_BEST (auto-picked YEARLY for a 30-day
            window), DISJOINT DAILY+WEEKLY+MONTHLY segments, fixed DAILY filtering (~71% of rows were
            dropped), data-completeness classification, SEGMENT / DATA_COMPLETENESS log events,
            per-bucket retention ceilings (~28 / ~182 / ~730 days)
          - v1.0.12: async icon loading off the main thread, incremental "+40" ranking rendering,
            JANK split into DEBUG/WARN, newest-first log view
          - v1.0.11: 8MB downscaled icon LruCache, top-40 grid, permission-screen flash fix,
            cheaper log reads, no more false Wi-Fi WARN
          - v1.0.10: long-range hour totals, permanent per-day launch history with cancellable
            backfill, always-visible click counts, 24-hour distribution
          - v1.0.9: full-capture runtime log + TXT export with AI prompt
          - v1.0.8: merged long-range ranking grid using system WEEKLY/MONTHLY/YEARLY buckets

          Measured on real devices (v1.0.11 / v1.0.12 logs): PSS peak 1375MB -> 254MB (OnePlus PGZ110),
          694MB -> 334MB (Xiaomi 22041216C); >500ms frame stalls 26 -> 1 and 46 -> 1; 0 ERROR / 0 FATAL;
          no LOW_MEMORY kills after the fix.

          Fixed signing certificate (SHA-256 d075b5e1...fef501): installs directly over v1.0.7+ with
          no uninstall. From v1.0.4-v1.0.6 an uninstall is still required once.
        files: artifacts/*.apk
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
