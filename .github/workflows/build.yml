name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Required to create a Release. Without this, action-gh-release fails with HTTP 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # A fixed keystore keeps the signing certificate identical across every CI run, so users can
    # install newer builds directly over older ones instead of being forced to uninstall first.
    - name: Decode the fixed signing keystore
      id: keystore
      run: |
        if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/myscreentime.jks"
          echo "path=$RUNNER_TEMP/myscreentime.jks" >> "$GITHUB_OUTPUT"
          echo "Fixed signing keystore decoded."
        else
          echo "No keystore secret configured; falling back to the default debug certificate."
        fi

    # The project has "default" and "gplay" product flavors, so a plain `assembleDebug` puts the
    # APK under apk/<flavor>/debug/ instead of apk/debug/. Build one flavor explicitly.
    - name: Build debug APK with Gradle
      env:
        ANDROID_KEY_STORE_FILE: ${{ steps.keystore.outputs.path }}
        ANDROID_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew assembleDefaultDebug

    - name: Locate and rename APK
      run: |
        APK=$(find app/build/outputs/apk/default/debug -name "*.apk" -type f | head -n 1)
        if [ -z "$APK" ]; then
          echo "No APK was produced. Contents of app/build/outputs/apk:"
          find app/build/outputs/apk -type f || true
          exit 1
        fi
        echo "Found APK: $APK"
        mkdir -p artifacts
        cp "$APK" "artifacts/MyScreenTime-v1.0.${{ github.run_number }}.apk"
        ls -lh artifacts

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: MyScreenTime v1.0.${{ github.run_number }}
        body: |
          Automated build from commit ${{ github.sha }}.

          What's new:
          - PERFORMANCE / UX: app icons are cached once and downscaled to their real display size (8MB LruCache); long-range ranking rows no longer keep ~800 full-size Drawables alive. Removes the 1.1GB PSS peak and the LOW_MEMORY kills seen on ColorOS
          - Ranking grid composes only the top 40 apps initially, with a "Show all N apps" toggle that collapses again when range/sort changes. Removes the 600-2400ms frame stalls when opening the month view
          - Fixed the permission-screen flash: AppOps transiently reports MODE_DEFAULT just after process start on some ROMs, so the start route is decided once and backed by a real UsageStatsManager query; the permission screen also checks immediately instead of waiting for an ON_RESUME that already fired
          - Log viewer auto-refresh reads only the newest files instead of rescanning the whole permanent history, and no longer recounts every line every 3 seconds
          - Device snapshot now writes a DEBUG note instead of a false WARN when ACCESS_WIFI_STATE is not granted
          - IMPORTANT: logging behaviour is UNCHANGED - every event is still captured, saved forever and never deleted; the full-history TXT export is untouched. Only rendering/reading was optimized
          - From v1.0.10: long-range hour totals, permanent day-by-day launch history with cancellable backfill, always-visible click counts, 24-hour distribution, full-capture runtime log + TXT export, new maintainer links
          - Long-range HOUR totals: each range (4 weeks / 6 months / year) now shows the accumulated hours, daily average, total opens and how many days of click data are recorded -- not just per-day increments
          - Fixed long-range click counts: Android's WEEKLY/MONTHLY/YEARLY buckets do NOT store launch counts, so a permanent local day-by-day launch history was added; counts for any period are summed from it. A "Backfill older opens" button scans at most 31 older days per tap (one-day chunks, saved to disk each day, cancellable), so a half-year/year can be filled without the long scan that used to get the process killed
          - Click count line is always visible now (0 opens instead of a hidden row); range labels no longer say "(avg)" while showing totals
          - New "Hours of day" 24-bar distribution with peak hour, built from the detailed usage events the device still keeps
          - FULL-CAPTURE runtime logging: one JSON event per line, batched off the main thread, per-day files that are NEVER deleted (only split into parts past 4MB)
          - Captures lifecycle/foreground, page path + dwell time, touch coordinates/gesture/3x3 zone, tap-to-frame latency, frame jank, query cost/thread/range/bucket counts, aggregation intermediates, memory/battery/thermal samples, StrictMode, full device snapshot, crashes, ANR watchdog, ApplicationExitInfo (LMK/ANR/native crash), WorkManager outcomes and manual markers
          - Log viewer upgraded: keyword search, event-type filters, auto refresh, add-a-marker, copy, and full-history TXT export with a built-in AI prompt + device snapshot + capture summary + process logcat
          - Website and source-code links now point to the new maintainer: homepage https://github.com/annbnn183 and source https://github.com/annbnn183/MyScreenTime (Fastlane store descriptions updated too); WeChat/email shown in Settings -> About
          - Retains: 4-column ranking grid, 4-week/6-month/year buckets, launch counts and rates, month view + insights + goal calendar, CSV export, daily goal reminder
          - Fixed APK signing: newer builds install directly over this one (no uninstall needed)
          - Vico blank-label crash hardening on every chart axis
        files: artifacts/*.apk
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
